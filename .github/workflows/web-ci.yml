# ==============================================================
# SindhHunar Web CI/CD Pipeline (GitHub Actions)
# ==============================================================
name: SindhHunar Web CI

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'infra/**'
      - 'docker-compose.yml'
      - '.github/workflows/web-ci.yml'

jobs:
  # ------------------------------------------------------------
  # Job 1: Code Quality Gate (Linting & TypeScript Checks)
  # ------------------------------------------------------------
  quality:
    name: Code Quality & Types Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install Web Dependencies (Clean Install)
        run: |
          cd web
          npm ci

      - name: 🔍 Run ESLint Check
        run: |
          cd web
          npm run lint

      - name: 🛡️ Run TypeScript Compilation Check
        run: |
          cd web
          npx tsc --noEmit

  # ------------------------------------------------------------
  # Job 2: Automated Docker Build & Verification Gate
  # ------------------------------------------------------------
  docker-build:
    name: Docker Image Build & Sanity
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ⚡ Build Docker Image with GitHub Actions Cache
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: sindhhunar-web:test
          # GitHub Actions Cache: Unchanged layers re-download nahi honge
          cache-from: type=gha
          cache-to: type=gha,mode=max
