# ==============================================================
# SindhHunar Mobile (React Native / Android) CI Pipeline
# ==============================================================
name: SindhHunar Mobile Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  # Manual Trigger: Developer GitHub UI se 1-click par APK generate kar sake
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------
  # Job: Automated Android APK Build & Artifact Packaging
  # ------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup & Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📦 Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: 🔑 Make Gradlew Executable
        run: chmod +x mobile/android/gradlew

      - name: 🔨 Compile & Build Android APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Generated APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sindhhunar-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
