# ================================================================
# SindhHunar Multi-Container Orchestration (With Nginx Reverse Proxy)
# ================================================================

services:
  # --------------------------------------------------------------
  # 1. Nginx Reverse Proxy & Edge Gateway
  # --------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: sindhhunar-nginx
    restart: unless-stopped
    ports:
      # Bahar ki dunya ke liye sirf standard Port 80 khula hai
      - "80:80"
    volumes:
      # Hamari banayi hui Nginx config ko container mein mount karte hain (Read-Only)
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - sindhhunar-network

  # --------------------------------------------------------------
  # 2. Web Application (Next.js 16)
  # --------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sindhhunar-web
    restart: unless-stopped
    # DevOps Security: Humne bahir se port 3000 band kar diya hai!
    # Ab koi bahar se direct Node.js par nahi aa sakta, sirf Nginx se aayega.
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sindhhunar-network

  # --------------------------------------------------------------
  # 3. Redis Cache & Real-Time Engine (Tracking & Sessions)
  # --------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sindhhunar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sindhhunar-network

# ----------------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------------
volumes:
  redis_data:
    driver: local

# ----------------------------------------------------------------
# Shared Private Network
# ----------------------------------------------------------------
networks:
  sindhhunar-network:
    driver: bridge
