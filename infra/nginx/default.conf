# ==============================================================
# SindhHunar Nginx Reverse Proxy Configuration
# ==============================================================

# Gzip Compression: Text, JS, aur CSS files ko compress karke bhejo
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# Upstream Server: Hamara Next.js Docker Container
upstream nextjs_upstream {
    server web:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Client Request Body Size limit (images upload ke liye)
    client_max_body_size 20M;

    # Next.js Static Cache Optimization
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Static files ko browser mein 1 saal ke liye cache karo
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static assets (favicon, images)
    location /public {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Web Proxy: Tamam baki requests Next.js ko bhejo
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSockets support (Next.js HMR aur real-time features ke liye)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client Headers pass karna (taake Next.js ko user ka asil IP pata ho)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
